version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://annarakshak:annarakshak@postgres:5432/annarakshak
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=annarakshak-production-secret-change-this
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - uploads:/app/uploads

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: annarakshak
      POSTGRES_USER: annarakshak
      POSTGRES_PASSWORD: annarakshak
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U annarakshak"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
  uploads:
